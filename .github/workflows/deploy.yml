name: Validate and deploy BiroMD to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          GALLERY_AUTHORIZED_CASE_IDS: ${{ vars.GALLERY_AUTHORIZED_CASE_IDS }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

      - name: Verify export and gallery authorization
        run: npm run verify:export
        env:
          GALLERY_AUTHORIZED_CASE_IDS: ${{ vars.GALLERY_AUTHORIZED_CASE_IDS }}

      - name: Run browser checks
        run: npm run test:e2e
        env:
          GALLERY_AUTHORIZED_CASE_IDS: ${{ vars.GALLERY_AUTHORIZED_CASE_IDS }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify canonical domain
        run: |
          effective_url="$(curl --silent --show-error --fail --location --max-redirs 2 --retry 4 --retry-all-errors --output /dev/null --write-out '%{url_effective}' https://www.biromd.com/)"
          test "$effective_url" = "https://biromd.com/"
